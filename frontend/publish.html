<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发布商品 - 校园二手交易平台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-content">
      <a href="dashboard.html" class="back-link">← 返回首页</a>
      <h1>发布商品</h1>
    </div>
  </header>

  <main class="main-content">
    <div class="publish-card">
      <form id="publish-form">
        <div class="form-group">
          <label>商品标题 *</label>
          <input type="text" id="title" placeholder="请输入商品标题">
        </div>
        <div class="form-group">
          <label>商品描述</label>
          <textarea id="description" placeholder="请输入商品描述"></textarea>
        </div>
        <div class="form-group">
          <label>价格 *</label>
          <input type="number" id="price" placeholder="请输入商品价格" step="0.01">
        </div>
        <div class="form-group">
          <label>分类</label>
          <select id="category">
            <option value="电子设备">电子设备</option>
            <option value="图书教材">图书教材</option>
            <option value="生活用品">生活用品</option>
            <option value="运动器材">运动器材</option>
            <option value="其他">其他</option>
          </select>
        </div>
        <button type="submit" class="submit-btn">发布商品</button>
        <p id="error-message" class="error-message"></p>
      </form>
    </div>
  </main>

  <script type="module" src="js/goods.js"></script>
</body>
</html>
