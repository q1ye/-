<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园二手交易平台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="auth-card">
      <h1>校园二手交易平台</h1>
      
      <div class="tab-container">
        <button class="tab-btn active" onclick="switchTab('login')">登录</button>
        <button class="tab-btn" onclick="switchTab('register')">注册</button>
      </div>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="login-username" placeholder="请输入用户名">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="login-password" placeholder="请输入密码">
        </div>
        <button type="submit" class="submit-btn">登录</button>
      </form>

      <form id="register-form" class="auth-form hidden">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="register-username" placeholder="请输入用户名">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="register-password" placeholder="请输入密码">
        </div>
        <button type="submit" class="submit-btn">注册</button>
      </form>

      <p id="error-message" class="error-message"></p>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
